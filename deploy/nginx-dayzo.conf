map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=dayzo_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name dayzove.lat www.dayzove.lat;
    return 301 https://dayzove.lat$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dayzove.lat www.dayzove.lat;

    ssl_certificate /etc/letsencrypt/live/dayzove.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dayzove.lat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512k;
    keepalive_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Nunca exponer health operativo a través del proxy público.
    location = /health-internal { return 404; }

    location = /api/auth/login {
        limit_req zone=dayzo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 65s;
    }
}
