name: dayzo_app
description: DAYZO — Tasas Binance, BCV y calculadora (cliente nativo).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  provider: ^6.1.2
  dio: ^5.10.0
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  connectivity_plus: ^7.2.0
  go_router: ^17.3.0
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  home_widget: ^0.9.3
  screenshot: ^3.0.0
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/dayzo_splash_logo.png
